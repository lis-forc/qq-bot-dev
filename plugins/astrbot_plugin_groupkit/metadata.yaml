name: astrbot_plugin_groupkit
display_name: 群助手
desc: 轻量群助手，图都由你自己提供、代码只负责排字。签到 = 文字 + 一张运势图（按日期+群+人固定抽一张，每天 3~10 额度）；做一张表情扣 3 额度，图鉴直接发你放好的那张长图；每发 100 条攒一次抽奖，抽到 10~20 额度；商店有名片 / 称号 / 双倍卡 / 抽奖券，名片统一 50。信息卡拿名片当底图、只在左侧排字：姓名 / 性别 / 爱好 / 额度 / 抽奖次数，不带头像；名片分男女基础款（按性别自动给）和可购买的商品款。额度排行前三名用奖牌；昵称体系：群名片拼成「🦊 张三」，被人手改会被掰回来（先字符串比对，一致就零请求返回），新成员没改名会在入群和每次发言时被提醒，提醒 3 次后静音 1 分钟；名字默认 2~4 字、不带数字与符号；商店里 500 额度买「自由人」可脱离规则。改名不收费。额度排行限 2 级以上，发言排行带开关（关着时口令彻底失效）。基础群管（禁言/踢人/全群禁言/发额度/授权）。「帮助」只列口令不写解释，按组用 emoji 分行，长则合并转发不刷屏。图片素材走三目录约定（checkin 运势图 / catalog 图鉴 / cards 名片），丢图进文件夹立刻生效。附 WebUI 配置台：左边分组、右边表单改完全部配置项（立刻生效），另有素材目录概览与群数据报表。
short_desc: 昵称体系 + 签到 + 背包（头衔/关系）+ 信息卡（六字段）+ 表情图鉴 + 群管，附 WebUI 配置台
author: w2140
version: 0.15.4
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.16"
